<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Таплист</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #e8a317;
    --per-row: 2;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: #141414; color-scheme: dark; }
  body { font-family: Inter, system-ui, sans-serif; }
  #app { min-height: 100vh; }

  /* ---------- общая раскладка ---------- */
  .board { padding-block: 24px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
  .lanes { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
  .lane { display: flex; flex-direction: column; gap: 24px; }
  .section h2 { margin: 0 0 12px; }
  .list { display: grid; grid-template-columns: repeat(var(--per-row), minmax(0, 1fr)); gap: 10px; }

  .tap { position: relative; display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; }
  .tap img { width: 64px; height: 64px; object-fit: contain; display: block; }
  .tap h3 { margin: 0; font-size: 17px; line-height: 1.15; }
  .brewery { margin: 3px 0 5px; font-size: 13px; opacity: .8; }
  .stats { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; }
  .stats .abv, .stats .ibu { font-weight: 600; white-space: nowrap; }
  .prices { display: flex; flex-direction: column; gap: 4px; text-align: right; font-size: 13px; white-space: nowrap; }
  .prices strong { font-size: 18px; margin-left: 6px; }
  .prices .sep { display: none; }
  .prices svg { width: 12px; height: 12px; margin-right: 3px; vertical-align: -1px; }
  .badge { position: absolute; left: 6px; bottom: 6px; font-size: 11px; font-weight: 800; padding: 2px 6px; border-radius: 4px; background: var(--accent); color: #111; }

  @media (max-width: 1100px) { .lanes { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 640px) {
    .board { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    .list { grid-template-columns: 1fr; }
    .taplist .section h2 { font-size: 20px; }
    .taplist .tap { grid-template-columns: 56px minmax(0, 1fr) auto; gap: 12px; }
    .taplist .tap img, .taplist .badge { width: 56px; }
    .taplist .tap img { height: 56px; }
    .taplist .prices, .taplist .prices strong { font-size: 13px; }
  }

  /* ---------- оформление как на экране бара ---------- */
  .taplist { background: #161514; color: #fff; font-family: Arial, Helvetica, sans-serif; }
  .taplist .board { padding-block: 10px; }
  .taplist .lanes, .taplist .lane { gap: 10px; }
  .taplist .section { background: #1d1c1a; border-left: 6px solid var(--section); padding: 0 16px 16px; }
  .taplist .section h2 {
    margin: 0 -16px 16px; padding: 12px 16px;
    background: linear-gradient(90deg, color-mix(in srgb, var(--section) 14%, #26231f), #26231f);
    text-align: center; text-transform: uppercase; letter-spacing: .03em;
    font-family: Montserrat, "Arial Black", Arial, sans-serif; font-size: 26px; font-weight: 800; color: #fff;
  }
  .taplist .list { gap: 16px 28px; }
  .taplist .tap { grid-template-columns: 76px minmax(0, 1fr) auto; gap: 18px; padding: 0; }
  .taplist .tap img { width: 76px; height: 76px; object-fit: cover; background: #fff; border-radius: 3px; box-shadow: 0 3px 8px rgba(0,0,0,.6); }
  .taplist .tap h3 { font-size: 15px; font-weight: 400; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .taplist .brewery { margin: 4px 0 8px; opacity: 1; color: #e58a2e; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .14em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .taplist .stats { gap: 0; font-size: 10px; font-weight: 700; color: #c9c4bb; }
  .taplist .stats span + span::before { content: "·"; margin: 0 6px; }
  .taplist .prices { text-align: left; font-size: 14px; font-weight: 700; gap: 6px; }
  .taplist .prices strong { font-size: 14px; margin: 0; }
  .taplist .prices .sep { display: inline; margin: 0 4px; }
  .taplist .badge { left: 0; bottom: -6px; width: 76px; text-align: center; border-radius: 999px; padding: 1px 0; font-size: 10px; }

</style>
</head>
<body>
<div id="app" class="taplist">

<main class="board"><div class="lanes" id="lanes"></div></main>

<script>
// Данные вытащены из страницы taplist (venue 28). Цены — в рублях.
const SECTIONS = [
  { id: "light",      title: "Светлое фильтрованное",   color: "#d7a742", lane: 0 },
  { id: "wheat",      title: "Пшеничное",               color: "#f0d270", lane: 0 },
  { id: "craft",      title: "IPA, SOUR, GOSE",         color: "#df7b32", lane: 0 },
  { id: "unfiltered", title: "Светлое нефильтрованное", color: "#c8ad68", lane: 1 },
  { id: "dark",       title: "Тёмное",                  color: "#a56a4a", lane: 1 },
  { id: "other",      title: "Не пиво",                 color: "#b94343", lane: 1 },
];

// [секция, название, пивоварня, страна, стиль, ABV, IBU, цена 0,5, цена 1 л, картинка, бейдж, иконки тары]
const TAPS = [
  ["light", "Grimbergen Blonde", "Alken-Maes", "FR", "Belgian Blonde", 6.7, 22, 8, 8, "beer-2_e6322_sm", "1.5=2"],
  ["light", "Krušovice 10 / Královské Světlé", "Heineken", "RU", "Lager - Světlé (Czech Pale)", 4.2, 23, 8, 8, "beer-23585_cc122_sm"],
  ["light", "Robim Good ZERO", "Robim Good Brewery", "BY", "Non-Alcoholic - Lager", 0, 20, 8, 8, "beer-6772340_d9f07_sm"],
  ["light", "Robim Good NORD", "Robim Good Brewery", "BY", "Pilsner - Czech / Bohemian", 4.8, 30, 8, 8, "beer-6752580_81765_sm"],
  ["unfiltered", "Beaver Леденцовое (Ledentsovoe)", "BEAVER (Пивоваренная компания БИВЕР)", "BY", "Lager - Pale", 5.2, null, 8, 8, "beer-3512093_fe17b_sm", "NEW"],
  ["unfiltered", "FAVORITE EURO LAGER", "BEAVER (Пивоваренная компания БИВЕР)", "BY", "Lager - Pale", 4.7, null, 9, 9, "beer-271865_e9e41_sm", null, true],
  ["unfiltered", "Robim Good SVEZAK", "Robim Good Brewery", "BY", "Lager - Světlé (Czech Pale)", 4.6, 13, 8, 8, "beer-3781653_d973a_sm"],
  ["unfiltered", "Robim Good OKTOBERFEST", "Robim Good Brewery", "BY", "Festbier", 6, 20, 8, 8, "beer-6868970_3ceeb_sm"],
  ["wheat", "Kronenbourg 1664 Blanc", "Brasseries Kronenbourg", "BY", "Wheat Beer - Witbier / Blanche", 5, 7, 8, 8, "beer-5999_bbc68_sm"],
  ["wheat", "Edelweiss Weizenbier", "Brau Union Österreich", "RU", "Wheat Beer - Hefeweizen", 5.3, null, 8, 8, "beer-3916373_a8fe9_sm"],
  ["wheat", "Edelweiss Snowfresh", "Brau Union Österreich", "RU", "Wheat Beer - Hefeweizen", 4.9, null, 9, 9, "beer-EdelweissSnowfresh_14622"],
  ["wheat", "Robim Good WAKE UP", "Robim Good Brewery", "BY", "Bock - Weizenbock", 6.5, 8, 8, 8, "beer-4091677_839df_sm"],
  ["dark", "1915", "Brewlok Brewery", "BY", "Stout - Other", 5.5, null, 8, 8, "beer-1214575_ec740_sm"],
  ["dark", "Веневитинская Дева", "Brewlok Brewery", "RU", "IPA - Black / Cascadian Dark Ale", 6, 70, 8, 8, "beer-1434483_ce7d8_sm"],
  ["dark", "Robim Good AMBER RAY", "Robim Good", "BY", "Lager - Amber / Red", 5.2, 9, 8, 8, "beer-3876307_8c9f0_sm"],
  ["dark", "Stoutopia", "Black Cat Brewery", "RU", "Stout - Milk / Sweet", 6.7, null, 9, 9, "beer-6400274_66007_sm"],
  ["dark", "Кощей", "Brewlok", "RU", "Stout - Coffee", 6.9, null, 9, 9, "beer-1731404_08e92_sm"],
  ["dark", "Pastry Worldwide: Chocolate, Cinnamon And Carob Syrup", "Black Cat Brewery", "RU", "Stout - Imperial / Double Pastry", 12.1, 7, 8, 8, "beer-6504522_b327d_sm"],
  ["dark", "Robim Good SUBSTANCE", "Robim Good Brewery", "BY", "Stout - Irish Dry", 6.4, 10, 8, 8, "beer-6057948_4bde2_sm"],
  ["craft", "70", "Black Cat Brewery", "RU", "IPA - American", 6.6, 70, 8, 8, "beer-1070427_c6c65_sm", null, true],
  ["craft", "Moscow Calling", "Black Cat Brewery", "BY", "Bitter - Best", 4.7, 30, 8, 8, "beer-5230956_29177_sm", null, true],
  ["craft", "Street Code", "Black Cat Brewery", "RU", "Sour - Fruited", 6.5, null, 8, 8, "beer-6455202_09956_sm"],
  ["craft", "Лихо Одноглазое", "Brewlok Brewery", "RU", "DIPA", 6.9, 120, 8, 8, "beer-1802346_97680_sm"],
  ["craft", "Офицер Дуфи", "Duble", "RU", "Sour - Smoothie / Pastry", 6.2, 9, 8, 8, "beer-6647293_d0807_sm"],
  ["craft", "СОБАКА СУТУЛАЯ", "Hops Brewery", "BY", "IPA - New England / Hazy", 6.3, 20, 8, 8, "beer-6860662_a3d13_sm"],
  ["craft", "СОЛО КОТ Цитра", "Black Cat Brewery", "BY", "IPA - American", 6.9, 68, 9, 9, "beer-6716775_f95ea_sm"],
  ["craft", "Caramba", "Brewlok Brewery", "BY", "IPA - Milkshake", 6.9, 40, 9, 9, "beer-2654974_2c914_sm"],
  ["craft", "Волчий Пастырь", "Brewlok Brewery", "RU", "IPA - Triple", 6.9, 105, 9, 9, "beer-2321101_aaac3_sm"],
  ["craft", "WET CAT", "Black Cat Brewery", "RU", "Sour - Fruited Berliner Weisse", 5, null, 8, 8, "beer-6299757_4b5f4_sm"],
  ["craft", "FACTORY IPA MILKSHAKE", "Robim Good Brewery", "BY", "IPA - Milkshake", 6.2, 25, 8, 8, "beer-5922097_08d5f_sm"],
  ["craft", "Tomato Factory BBQ", "Robim Good", "BY", "Sour -Tomato /Vegetable Gose", 6, null, 8, 8, "beer-6514539_d0b41_sm"],
  ["craft", "Rager: Krush", "Valaduta Brovar", "BY", "IPA - Imperial / Double", 6.8, 70, 8, 8, "beer-6909842_60415_sm"],
  ["craft", "Образец Мутный ХЗ-1", "Zavod", "BY", "IPA - New England / Hazy", 6.1, 50, 8, 8, "beer-6698917_9abc6_sm"],
  ["other", "Гозе", "Black Cat Brewery", "RU", "Sour - Traditional Gose", 5.3, null, 9, 9, "beer-6858986_be274_sm"],
  ["other", "Pulse. Mango Plum Passion Fruit", "Hops Brewery", "BY", "Sour - Fruited", 6, null, 8, 8, "beer-6715946_19874_sm"],
  ["other", "MASS/01", "Zavod", "BY", "Sour - Fruited", 5.8, 10, 8, 8, "beer-6716296_9f33c_sm"],
];

const flag = cc => cc.replace(/./g, ch => String.fromCodePoint(0x1F1A5 + ch.charCodeAt(0)));
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));

const MUG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M4 4h13v3h1.5a4.5 4.5 0 0 1 0 9H17v2a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V4Zm13 6v3h1.5a1.5 1.5 0 0 0 0-3H17Z"/></svg>';
const BOTTLE = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 2h6v5.4l2.25 3.15c.49.69.75 1.52.75 2.37V19a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3v-6.08c0-.85.26-1.68.75-2.37L9 7.4V2Z"/></svg>';

function tapHtml([, name, brewery, cc, style, abv, ibu, p05, p1, img, badge, icons]) {
  return `<article class="tap">
    <img src="https://assets.untappd.com/site/beer_logos/${img}.jpeg" alt="" loading="lazy">
    <div>
      <h3>${esc(name)}${badge ? ` <span class="badge">${esc(badge)}</span>` : ""}</h3>
      <p class="brewery">${flag(cc)} ${esc(brewery)}</p>
      <div class="stats">
        <span class="style">${esc(style)}</span>
        <span class="abv">${abv}%</span>
        ${ibu != null ? `<span class="ibu">${ibu} IBU</span>` : ""}
      </div>
    </div>
    <div class="prices">
      <div>${icons ? MUG : ""}0,5 л<span class="sep">–</span><strong>${p05} р.</strong></div>
      <div>${icons ? BOTTLE : ""}1 л<span class="sep">–</span><strong>${p1} р.</strong></div>
    </div>
  </article>`;
}

const lanes = [document.createElement("div"), document.createElement("div")];
lanes.forEach(l => { l.className = "lane"; document.getElementById("lanes").appendChild(l); });
for (const s of SECTIONS) {
  const taps = TAPS.filter(t => t[0] === s.id);
  lanes[s.lane].insertAdjacentHTML("beforeend",
    `<section class="section" style="--section:${s.color}">
       <h2>${esc(s.title)}</h2>
       <div class="list">${taps.map(tapHtml).join("")}</div>
     </section>`);
}

</script>
</div>
</body>
</html>
