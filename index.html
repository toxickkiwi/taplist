<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Таплист</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  /* Экран бара: всё помещается строго в одно окно. Размеры в rem,
     а размер rem подбирает скрипт в конце страницы. */
  :root {
    /* палитра Robim Good: кремовый, Black 6 C, оранжевые 2028/165/144, жёлтый 130 */
    --rg-cream: #f7f2e8; --rg-black: #101820; --rg-red: #C63418; --rg-orange: #EC6608; --rg-amber: #F39000; --rg-yellow: #FAB600;
    --bg: #17191c; --panel: #222428; --fg: #f7f2e8; --muted: #a9a59c; --line: rgba(255,255,255,.08);
    --price: var(--rg-yellow); --brewery: #c9c3b8;
    --rg: var(--rg-orange);
    --zero: #38bdf8;
    --t-new: #3fae5a; --t-sale: var(--rg-red); --t-promo: var(--rg-yellow); --t-top: var(--rg-cream);
  }
  .light {
    --bg: #e9e3d6; --panel: var(--rg-cream); --fg: var(--rg-black); --muted: #5f5a52; --line: rgba(0,0,0,.08);
    --price: var(--rg-red); --brewery: #5f5a52;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #17191c; color-scheme: dark; }
  html { font-size: 10px; }
  body { font-family: Arial, Helvetica, sans-serif; }

  #app {
    height: 100vh; height: 100dvh; display: flex;
    background: var(--bg); color: var(--fg);
    padding-block: .6rem;
    padding-left: max(.6rem, env(safe-area-inset-left, 0px));
    padding-right: max(.6rem, env(safe-area-inset-right, 0px));
  }
  .lanes { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: .6rem; }
  .lane { min-height: 0; display: flex; flex-direction: column; gap: .6rem; }

  /* ---------- секции: яркая шапка цвета сорта ---------- */
  .section { flex: var(--grow) 1 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; background: var(--panel); border-radius: .6rem; }
  .section h2 {
    flex: none; margin: 0; padding: .7rem 1.6rem;
    background: var(--section-bg); color: var(--section-fg); border-bottom: .3rem solid var(--section);
    text-align: center; text-transform: uppercase; letter-spacing: .04em; line-height: 1.1;
    font-family: Montserrat, "Arial Black", Arial, sans-serif; font-size: 2.8rem; font-weight: 900;
  }
  /* шапки «как бар»: все жёлтые с графитовым текстом */
  .hdr-bar .section h2 { background: var(--rg-yellow); color: var(--rg-black); border-bottom-color: var(--rg-yellow); }
  .hdr-bar .num b { color: var(--rg-yellow); }
  .light.hdr-bar .num b, .light .pale .num b { color: var(--rg-black); }
  .list { flex: 1 0 auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-content: space-evenly; gap: .8rem 1.6rem; padding: 1rem 1.2rem; }

  /* ---------- карточка сорта ---------- */
  .tap {
    position: relative; display: grid; align-items: center; gap: 1.2rem;
    grid-template-columns: auto auto minmax(0, 1fr) auto;
    padding: .5rem .8rem; border: .25rem solid transparent; border-radius: .8rem;
  }
  .num { display: flex; flex-direction: column; align-items: center; min-width: 4.4rem; text-align: center; font-family: Montserrat, Arial, sans-serif; font-weight: 900; font-size: 3.4rem; line-height: 1; color: var(--section); font-variant-numeric: tabular-nums; }
  .no-num .num b { display: none; }
  .no-num .num { min-width: 0; }

  .media { position: relative; width: 6.4rem; flex: none; }
  .media img, .media .glass { width: 6.4rem; height: 6.4rem; }
  .media img { display: block; }
  .media .glass { display: none; }

  /* картинки: 1) логотип в одинаковой белой плитке */
  .img-tile .media img { object-fit: contain; background: #fff; border-radius: .6rem; padding: .3rem; box-shadow: 0 .2rem .6rem rgba(0,0,0,.35); }
  /* 2) круг с обводкой цвета отдела */
  .img-circle .media img { object-fit: cover; border-radius: 50%; background: #fff; box-shadow: 0 0 0 .3rem var(--section); }
  /* 3) бокал, залитый цветом пива — без логотипов */
  .img-glass .media img { display: none; }
  .img-glass .media .glass { display: block; }
  /* 4) без картинок */
  .img-none .media { display: none; }
  .img-none .tap { grid-template-columns: auto minmax(0, 1fr) auto; }

  .info { min-width: 0; }
  .tap h3 { margin: 0; font-size: 2.1rem; font-weight: 700; line-height: 1.1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .brewery { margin: .3rem 0 .4rem; color: var(--brewery); font-size: 1.15rem; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stats { display: flex; flex-wrap: wrap; align-items: baseline; font-size: 1.15rem; color: var(--muted); }
  .stats span { white-space: nowrap; }
  .stats span + span::before { content: "·"; margin: 0 .5rem; }
  .stats .abv { color: var(--fg); font-weight: 800; font-size: 1.35rem; }

  .prices { display: grid; grid-template-columns: auto auto; gap: .2rem .7rem; align-items: baseline; white-space: nowrap; }
  .prices span { font-size: 1.3rem; color: var(--muted); text-align: right; }
  .prices strong { font-size: 2.4rem; font-weight: 900; color: var(--price); font-family: Montserrat, Arial, sans-serif; font-variant-numeric: tabular-nums; }
  .prices small { font-size: .6em; margin-left: .15em; }

  /* ---------- Robim Good и нулёвки ---------- */
  .rg-mark { display: none; margin-right: .5rem; padding: .1rem .45rem; border-radius: .4rem; background: var(--rg); color: #1f0d00; font: 900 1.2rem/1.3 Montserrat, Arial, sans-serif; vertical-align: .35rem; }
  .rg-on .tap.rg .rg-mark { display: inline-block; }
  .rg-on .tap.rg .brewery { color: var(--rg); }
  .rg-frame .tap.rg { border-color: var(--rg); }
  .rg-fill .tap.rg { background: color-mix(in srgb, var(--rg) 16%, transparent); }
  .rg-on .tap.zero { --rg: var(--zero); }
  .rg-on .tap.zero .rg-mark { background: var(--zero); color: #04263a; }

  /* ---------- метки ---------- */
  .tag { display: inline-flex; align-items: center; gap: .3rem; border-radius: .5rem; padding: .25rem .7rem; font: 900 1.35rem/1.1 Montserrat, Arial, sans-serif; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; background: var(--tc); color: var(--tfg, #fff); }
  .tag.new   { --tc: var(--t-new); }
  .tag.sale  { --tc: var(--t-sale); }
  .tag.promo { --tc: var(--t-promo); --tfg: var(--rg-black); }
  .tag.top   { --tc: var(--t-top); --tfg: var(--rg-black); }
  .tag.zero  { --tc: var(--zero); --tfg: #04263a; }
  /* Метки никогда не перекрывают картинку: под фото или под номером. */
  .num .tag, .photo-tag { display: none; }
  .tags-photo .photo-tag { display: flex; justify-content: center; margin-top: .4rem; }
  .tags-num .num .tag, .img-none .num .tag { display: inline-flex; }
  .img-none .photo-tag { display: none; }
  .num .tag { margin-top: .4rem; }
  .photo-tag .tag, .num .tag { font-size: 1.15rem; padding: .2rem .5rem; }

  /* ---------- панель настроек (на ТВ прячется сама) ---------- */
  .gear {
    position: fixed; right: max(1rem, env(safe-area-inset-right, 0px)); bottom: max(1rem, env(safe-area-inset-bottom, 0px)); z-index: 20;
    width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(0,0,0,.6); color: #fff; font-size: 22px; transition: opacity .3s;
  }
  .idle .gear { opacity: 0; }
  .panel {
    position: fixed; right: max(1rem, env(safe-area-inset-right, 0px)); bottom: calc(max(1rem, env(safe-area-inset-bottom, 0px)) + 54px); z-index: 20;
    width: min(340px, calc(100vw - 32px)); max-height: calc(100vh - 90px); overflow: auto;
    padding: 14px 16px; border-radius: 12px; background: #fff; color: #17130f;
    font: 14px/1.35 Arial, sans-serif; box-shadow: 0 10px 40px rgba(0,0,0,.5);
  }
  .panel h4 { margin: 12px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #7a6f62; }
  .panel h4:first-child { margin-top: 0; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .opts label { cursor: pointer; }
  .opts input { position: absolute; opacity: 0; }
  .opts span { display: inline-block; padding: 5px 10px; border-radius: 99px; border: 1px solid #d6cdbf; }
  .opts input:checked + span { background: #17130f; border-color: #17130f; color: #fff; }
  .opts input:focus-visible + span { outline: 2px solid #f0953a; outline-offset: 2px; }
  .panel p { margin: 12px 0 0; font-size: 12px; color: #7a6f62; }

  @media (prefers-reduced-motion: reduce) { .gear { transition: none; } }
</style>
</head>
<body>
<div id="app">
  <div class="lanes" id="lanes"></div>
</div>

<button class="gear" id="gear" type="button" aria-label="Настройки вида" aria-expanded="false">⚙</button>
<form class="panel" id="panel" hidden>
  <h4>Нумерация</h4>
  <div class="opts" data-key="num">
    <label><input type="radio" name="num" value="dept"><span>По отделам</span></label>
    <label><input type="radio" name="num" value="all"><span>Сквозная</span></label>
    <label><input type="radio" name="num" value="off"><span>Без номеров</span></label>
  </div>
  <h4>Картинки</h4>
  <div class="opts" data-key="img">
    <label><input type="radio" name="img" value="tile"><span>Плитка</span></label>
    <label><input type="radio" name="img" value="circle"><span>Круг</span></label>
    <label><input type="radio" name="img" value="glass"><span>Бокал по цвету</span></label>
    <label><input type="radio" name="img" value="none"><span>Без картинок</span></label>
  </div>
  <h4>Robim Good и нулёвки</h4>
  <div class="opts" data-key="rg">
    <label><input type="radio" name="rg" value="fill"><span>Фон</span></label>
    <label><input type="radio" name="rg" value="frame"><span>Рамка</span></label>
    <label><input type="radio" name="rg" value="off"><span>Не выделять</span></label>
  </div>
  <h4>Метки</h4>
  <div class="opts" data-key="tags">
    <label><input type="radio" name="tags" value="photo"><span>Под фото</span></label>
    <label><input type="radio" name="tags" value="num"><span>Под номером</span></label>
  </div>
  <h4>Шапки категорий</h4>
  <div class="opts" data-key="hdr">
    <label><input type="radio" name="hdr" value="brand"><span>Цвета Robim Good</span></label>
    <label><input type="radio" name="hdr" value="bar"><span>Жёлтые, как бар</span></label>
  </div>
  <h4>Фон</h4>
  <div class="opts" data-key="theme">
    <label><input type="radio" name="theme" value="dark"><span>Тёмный</span></label>
    <label><input type="radio" name="theme" value="light"><span>Светлый</span></label>
  </div>
  <p>Настройки запоминаются в этом браузере. Кнопка ⚙ прячется, если не двигать мышь.</p>
</form>

<script>
// Цвета шапок из палитры Robim Good; «Не пиво» — графитовая шапка с кремовой линией.
const SECTIONS = [
  { id: "light",      title: "Светлое фильтрованное",   color: "#FAB600", bg: "#FAB600", fg: "#101820", lane: 0 },
  { id: "wheat",      title: "Пшеничное",               color: "#f7f2e8", bg: "#f7f2e8", fg: "#101820", lane: 0, pale: true },
  { id: "craft",      title: "IPA, SOUR, GOSE",         color: "#EC6608", bg: "#EC6608", fg: "#f7f2e8", lane: 0 },
  { id: "unfiltered", title: "Светлое нефильтрованное", color: "#F39000", bg: "#F39000", fg: "#101820", lane: 1 },
  { id: "dark",       title: "Тёмное",                  color: "#C63418", bg: "#C63418", fg: "#f7f2e8", lane: 1 },
  { id: "other",      title: "Не пиво",                 color: "#f7f2e8", bg: "#101820", fg: "#f7f2e8", lane: 1, pale: true },
];

// Метки, которые есть в админке: Zero, New, %, 1.5=2, Top.
const TAGS = {
  "NEW":   { cls: "new",   text: "Новинка",  short: "NEW" },
  "%":     { cls: "sale",  text: "% Акция",  short: "%" },
  "1.5=2": { cls: "promo", text: "1,5 = 2 л", short: "1,5=2" },
  "TOP":   { cls: "top",   text: "★ Топ",    short: "TOP" },
  "ZERO":  { cls: "zero",  text: "0,0%",     short: "0,0" },
};

// [секция, название, пивоварня, страна, стиль, ABV, IBU, цена 0,5, цена 1 л, картинка, метка]
const TAPS = [
  ["light", "Grimbergen Blonde", "Alken-Maes", "FR", "Belgian Blonde", 6.7, 22, 8, 8, "beer-2_e6322_sm", "1.5=2"],
  ["light", "Krušovice 10 / Královské Světlé", "Heineken", "RU", "Lager - Světlé (Czech Pale)", 4.2, 23, 8, 8, "beer-23585_cc122_sm"],
  ["light", "Robim Good ZERO", "Robim Good Brewery", "BY", "Non-Alcoholic - Lager", 0, 20, 8, 8, "beer-6772340_d9f07_sm"],
  ["light", "Robim Good NORD", "Robim Good Brewery", "BY", "Pilsner - Czech / Bohemian", 4.8, 30, 8, 8, "beer-6752580_81765_sm"],
  ["unfiltered", "Beaver Леденцовое (Ledentsovoe)", "BEAVER (Пивоваренная компания БИВЕР)", "BY", "Lager - Pale", 5.2, null, 8, 8, "beer-3512093_fe17b_sm", "NEW"],
  ["unfiltered", "FAVORITE EURO LAGER", "BEAVER (Пивоваренная компания БИВЕР)", "BY", "Lager - Pale", 4.7, null, 9, 9, "beer-271865_e9e41_sm"],
  ["unfiltered", "Robim Good SVEZAK", "Robim Good Brewery", "BY", "Lager - Světlé (Czech Pale)", 4.6, 13, 8, 8, "beer-3781653_d973a_sm"],
  ["unfiltered", "Robim Good OKTOBERFEST", "Robim Good Brewery", "BY", "Festbier", 6, 20, 8, 8, "beer-6868970_3ceeb_sm"],
  ["wheat", "Kronenbourg 1664 Blanc", "Brasseries Kronenbourg", "BY", "Wheat Beer - Witbier / Blanche", 5, 7, 8, 8, "beer-5999_bbc68_sm", "%"],
  ["wheat", "Edelweiss Weizenbier", "Brau Union Österreich", "RU", "Wheat Beer - Hefeweizen", 5.3, null, 8, 8, "beer-3916373_a8fe9_sm"],
  ["wheat", "Edelweiss Snowfresh", "Brau Union Österreich", "RU", "Wheat Beer - Hefeweizen", 4.9, null, 9, 9, "beer-EdelweissSnowfresh_14622"],
  ["wheat", "Robim Good WAKE UP", "Robim Good Brewery", "BY", "Bock - Weizenbock", 6.5, 8, 8, 8, "beer-4091677_839df_sm"],
  ["dark", "1915", "Brewlok Brewery", "BY", "Stout - Other", 5.5, null, 8, 8, "beer-1214575_ec740_sm"],
  ["dark", "Веневитинская Дева", "Brewlok Brewery", "RU", "IPA - Black / Cascadian Dark Ale", 6, 70, 8, 8, "beer-1434483_ce7d8_sm"],
  ["dark", "Robim Good AMBER RAY", "Robim Good", "BY", "Lager - Amber / Red", 5.2, 9, 8, 8, "beer-3876307_8c9f0_sm"],
  ["dark", "Stoutopia", "Black Cat Brewery", "RU", "Stout - Milk / Sweet", 6.7, null, 9, 9, "beer-6400274_66007_sm"],
  ["dark", "Кощей", "Brewlok", "RU", "Stout - Coffee", 6.9, null, 9, 9, "beer-1731404_08e92_sm"],
  ["dark", "Pastry Worldwide: Chocolate, Cinnamon And Carob Syrup", "Black Cat Brewery", "RU", "Stout - Imperial / Double Pastry", 12.1, 7, 8, 8, "beer-6504522_b327d_sm"],
  ["dark", "Robim Good SUBSTANCE", "Robim Good Brewery", "BY", "Stout - Irish Dry", 6.4, 10, 8, 8, "beer-6057948_4bde2_sm"],
  ["craft", "70", "Black Cat Brewery", "RU", "IPA - American", 6.6, 70, 8, 8, "beer-1070427_c6c65_sm", "TOP"],
  ["craft", "Moscow Calling", "Black Cat Brewery", "BY", "Bitter - Best", 4.7, 30, 8, 8, "beer-5230956_29177_sm"],
  ["craft", "Street Code", "Black Cat Brewery", "RU", "Sour - Fruited", 6.5, null, 8, 8, "beer-6455202_09956_sm"],
  ["craft", "Лихо Одноглазое", "Brewlok Brewery", "RU", "DIPA", 6.9, 120, 8, 8, "beer-1802346_97680_sm"],
  ["craft", "Офицер Дуфи", "Duble", "RU", "Sour - Smoothie / Pastry", 6.2, 9, 8, 8, "beer-6647293_d0807_sm", "NEW"],
  ["craft", "СОБАКА СУТУЛАЯ", "Hops Brewery", "BY", "IPA - New England / Hazy", 6.3, 20, 8, 8, "beer-6860662_a3d13_sm"],
  ["craft", "СОЛО КОТ Цитра", "Black Cat Brewery", "BY", "IPA - American", 6.9, 68, 9, 9, "beer-6716775_f95ea_sm"],
  ["craft", "Caramba", "Brewlok Brewery", "BY", "IPA - Milkshake", 6.9, 40, 9, 9, "beer-2654974_2c914_sm"],
  ["craft", "Волчий Пастырь", "Brewlok Brewery", "RU", "IPA - Triple", 6.9, 105, 9, 9, "beer-2321101_aaac3_sm"],
  ["craft", "WET CAT", "Black Cat Brewery", "RU", "Sour - Fruited Berliner Weisse", 5, null, 8, 8, "beer-6299757_4b5f4_sm"],
  ["craft", "FACTORY IPA MILKSHAKE", "Robim Good Brewery", "BY", "IPA - Milkshake", 6.2, 25, 8, 8, "beer-5922097_08d5f_sm"],
  ["craft", "Tomato Factory BBQ", "Robim Good", "BY", "Sour -Tomato /Vegetable Gose", 6, null, 8, 8, "beer-6514539_d0b41_sm"],
  ["craft", "Rager: Krush", "Valaduta Brovar", "BY", "IPA - Imperial / Double", 6.8, 70, 8, 8, "beer-6909842_60415_sm"],
  ["craft", "Образец Мутный ХЗ-1", "Zavod", "BY", "IPA - New England / Hazy", 6.1, 50, 8, 8, "beer-6698917_9abc6_sm"],
  ["other", "Гозе", "Black Cat Brewery", "RU", "Sour - Traditional Gose", 5.3, null, 9, 9, "beer-6858986_be274_sm"],
  ["other", "Pulse. Mango Plum Passion Fruit", "Hops Brewery", "BY", "Sour - Fruited", 6, null, 8, 8, "beer-6715946_19874_sm"],
  ["other", "MASS/01", "Zavod", "BY", "Sour - Fruited", 5.8, 10, 8, 8, "beer-6716296_9f33c_sm"],
];

const flag = cc => cc.replace(/./g, ch => String.fromCodePoint(0x1F1A5 + ch.charCodeAt(0)));
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));

// Цвет пива для варианта «бокал»: по стилю, иначе по отделу.
const CATEGORY_COLOR = { light: "#f2c94c", unfiltered: "#e8b04a", wheat: "#f6d98a", dark: "#3b1d0e", craft: "#e8892f", other: "#d9466f" };
function beerColor(section, style) {
  if (/Stout|Black/i.test(style)) return "#24120a";
  if (/Amber|Red/i.test(style)) return "#a4471b";
  if (/Sour|Gose/i.test(style)) return "#e0607e";
  if (/Hazy|New England|Milkshake/i.test(style)) return "#f0a63a";
  if (/IPA|Bitter/i.test(style)) return "#e08a2a";
  return CATEGORY_COLOR[section];
}
const glass = color => `<svg class="glass" viewBox="0 0 64 64" aria-hidden="true">
  <path d="M16 12h32l-4 46a4 4 0 0 1-4 4H24a4 4 0 0 1-4-4z" fill="${color}"/>
  <path d="M14 8c0-3 3-5 6-5 2-2 6-3 9-1 3-2 8-1 10 1 3-1 7 0 9 3 3 0 5 3 4 6H14z" fill="#fff8e7"/>
  <path d="M24 18l2 38" stroke="rgba(255,255,255,.35)" stroke-width="3" stroke-linecap="round"/>
</svg>`;

function tapHtml(t, num) {
  const [section, name, brewery, cc, style, abv, ibu, p05, p1, img, tag] = t;
  const isRg = /^Robim Good/i.test(brewery);
  const isZero = abv === 0;
  const tagKey = tag || (isZero ? "ZERO" : null);
  const tagDef = tagKey && TAGS[tagKey];
  const tagHtml = tagDef ? `<span class="tag ${tagDef.cls}">${esc(tagDef.short)}</span>` : "";
  return `<article class="tap${isRg ? " rg" : ""}${isZero ? " zero" : ""}">
    <div class="num"><b>${num}</b>${tagHtml}</div>
    <div class="media">
      <img src="https://assets.untappd.com/site/beer_logos/${img}.jpeg" alt="" loading="lazy">
      ${glass(beerColor(section, style))}
      ${tagHtml ? `<div class="photo-tag">${tagHtml}</div>` : ""}
    </div>
    <div class="info">
      <h3>${isRg ? `<span class="rg-mark">RGB</span>` : ""}${esc(name)}</h3>
      <p class="brewery">${flag(cc)} ${esc(brewery)}</p>
      <div class="stats">
        <span class="abv">${abv}%</span>
        ${ibu != null ? `<span class="ibu">${ibu} IBU</span>` : ""}
        <span class="style">${esc(style)}</span>
      </div>
    </div>
    <div class="prices">
      <span>0,5 л</span><strong>${p05}<small>р.</small></strong>
      <span>1 л</span><strong>${p1}<small>р.</small></strong>
    </div>
  </article>`;
}

const app = document.getElementById("app");
const lanes = [document.createElement("div"), document.createElement("div")];
lanes.forEach(l => { l.className = "lane"; document.getElementById("lanes").appendChild(l); });

function render(numbering) {
  lanes.forEach(l => { l.innerHTML = ""; });
  let total = 0;
  for (const s of SECTIONS) {
    const taps = TAPS.filter(t => t[0] === s.id);
    const items = taps.map((t, i) => tapHtml(t, numbering === "all" ? ++total : i + 1)).join("");
    lanes[s.lane].insertAdjacentHTML("beforeend",
      `<section class="section${s.pale ? " pale" : ""}" style="--section:${s.color}; --section-bg:${s.bg}; --section-fg:${s.fg}; --grow:${Math.ceil(taps.length / 2) + 0.8}">
         <h2>${esc(s.title)}</h2>
         <div class="list">${items}</div>
       </section>`);
  }
}

// Подбираем размер так, чтобы весь таплист влез в окно без прокрутки.
function fit() {
  const sections = [...document.querySelectorAll(".section")];
  const fits = () => sections.every(sec => sec.scrollHeight <= sec.clientHeight + 1 && sec.scrollWidth <= sec.clientWidth + 1);
  let lo = 2, hi = 40;
  for (let i = 0; i < 14; i++) {
    const mid = (lo + hi) / 2;
    document.documentElement.style.fontSize = mid + "px";
    if (fits()) lo = mid; else hi = mid;
  }
  document.documentElement.style.fontSize = lo + "px";
}

// Настройки вида
const DEFAULTS = { num: "dept", img: "tile", rg: "fill", tags: "photo", hdr: "brand", theme: "dark" };
let settings = { ...DEFAULTS };
try { Object.assign(settings, JSON.parse(localStorage.getItem("taplist-settings") || "{}")); } catch (e) {}
if (!["photo", "num"].includes(settings.tags)) settings.tags = DEFAULTS.tags;

function apply() {
  app.className = [
    settings.num === "off" ? "no-num" : "",
    "img-" + settings.img,
    settings.rg === "off" ? "" : "rg-on rg-" + settings.rg,
    "tags-" + settings.tags,
    settings.theme === "light" ? "light" : "",
    settings.hdr === "bar" ? "hdr-bar" : "",
  ].join(" ");
  render(settings.num);
  fit();
}

const panel = document.getElementById("panel");
const gear = document.getElementById("gear");
for (const [key, value] of Object.entries(settings)) {
  const input = panel.querySelector(`input[name="${key}"][value="${value}"]`);
  if (input) input.checked = true;
}
panel.addEventListener("change", e => {
  settings[e.target.name] = e.target.value;
  try { localStorage.setItem("taplist-settings", JSON.stringify(settings)); } catch (err) {}
  apply();
});
gear.addEventListener("click", () => {
  panel.hidden = !panel.hidden;
  gear.setAttribute("aria-expanded", String(!panel.hidden));
});

let idleTimer;
function wake() {
  document.body.classList.remove("idle");
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (panel.hidden) document.body.classList.add("idle"); }, 4000);
}
["mousemove", "touchstart", "keydown"].forEach(ev => addEventListener(ev, wake, { passive: true }));
wake();

apply();
addEventListener("resize", fit);
document.fonts?.ready.then(fit);
</script>
</body>
</html>
